<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML and CSS Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <h1>Basic HTML and CSS Quiz</h1>

    <form>
        <label for="q1">1. What HTML element is used to create a paragraph?</label>
        <input type="text" id="q1" name="q1">

        <label for="q2">2. Explain one difference between HTML and CSS.</label>
        <textarea id="q2" name="q2"></textarea>

        <label for="q3">3. Which language is primarily used to style a webpage?</label>
        <select id="q3" name="q3">
            <option value="" selected disabled>Choose One ...</option>
            <option value="html">HTML</option>
            <option value="css">CSS</option>
            <option value="javascript">JavaScript</option>
        </select>

        <label for="q4">4. How many heading levels does HTML have?</label>
        <input type="number" id="q4" name="q4">

        <button type="submit">Submit Quiz</button>
    </form>
</body>

</html>
